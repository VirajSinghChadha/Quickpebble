name: Release

# Push a tag like v2.0.0 to build installers for macOS (Apple silicon + Intel), Windows and Linux, attach them to a
# GitHub release, and refresh the Homebrew cask. The tag must match the version in package.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match package.json)
        required: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node -e "const v=require('./package.json').version; if ('v'+v !== process.env.TAG) { console.error('Tag '+process.env.TAG+' does not match package.json version '+v); process.exit(1); }"
      - name: Make sure the tag exists for manual runs
        if: github.event_name == 'workflow_dispatch'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || \
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: "--mac --arm64 --x64" }
          - { name: Windows, os: windows-latest, args: "--win --x64" }
          - { name: Linux, os: ubuntu-latest, args: "--linux" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Without Apple/Windows certificates the builds are unsigned (see docs/SIGNING.md); set CSC_LINK and
      # CSC_KEY_PASSWORD (and the APPLE_* variables for notarisation) as repository secrets to sign them.
      - name: Package and upload to the release
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  homebrew:
    name: Update Homebrew cask
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Regenerate cask
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./scripts/update_cask.sh "$TAG"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/quick-pebble.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(brew): quick-pebble $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
