<div style="background:#f3f7fb;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;border:1px solid #e3eaf2;">
    <tr><td align="center" style="padding:32px 32px 8px;">
      <img src="https://raw.githubusercontent.com/VirajSinghChadha/Quickpebble/main/src-tauri/icons/128x128.png" width="64" height="64" alt="Quick Pebble" style="display:block;border-radius:16px;">
      <div style="margin-top:12px;font-size:18px;font-weight:700;color:#0f172a;">Quick Pebble</div>
    </td></tr>
    <tr><td align="center" style="padding:16px 32px 0;">
      <h1 style="margin:0;font-size:22px;line-height:1.3;color:#0f172a;">Your sign-in code</h1>
      <p style="margin:10px 0 0;font-size:15px;line-height:1.5;color:#475569;">Enter this code in the Quick Pebble app to continue.</p>
    </td></tr>
    <tr><td align="center" style="padding:24px 32px;">
      <div style="display:inline-block;background:#e8f8f5;border:1px solid #bfeee6;border-radius:12px;padding:16px 28px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#0b7d6e;">{{ .Token }}</div>
      <p style="margin:16px 0 0;font-size:13px;color:#64748b;">The code expires in one hour.</p>
    </td></tr>
    <tr><td style="padding:0 32px 28px;">
      <div style="border-top:1px solid #e3eaf2;padding-top:16px;font-size:12px;line-height:1.5;color:#94a3b8;text-align:center;">
        If you didn't ask for this, you can ignore this email. Nobody can sign in without the code.
      </div>
    </td></tr>
  </table>
</div>
